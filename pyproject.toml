[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reimbursement-multi-agent-poc"
version = "0.1.0"
description = "Offline-first claims triage prototype for a business case"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "python-dotenv>=1,<2"]
app = ["streamlit>=1.42,<2", "python-dotenv>=1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
